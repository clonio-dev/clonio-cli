name: build

on:
  push:
    tags:
      - 'v*'
  # Manual dry-run: runs test + build, uploads binaries as artifacts, skips release + packagist.
  # Use from the Actions tab to verify CI changes on a branch before tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Rector cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock', 'rector.php') }}-v2
          restore-keys: ${{ runner.os }}-rector-
      - run: mkdir -p /tmp/rector

      - name: PHPStan cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock', 'phpstan.neon') }}-v2
          restore-keys: ${{ runner.os }}-phpstan-
      - run: mkdir -p /tmp/phpstan

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: composer test

  build:
    name: Build — ${{ matrix.output }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            spc-binary: spc-linux-x86_64
            output: clonio-linux-x86_64
            upload_phar: true
          - runner: ubuntu-24.04-arm
            spc-binary: spc-linux-aarch64
            output: clonio-linux-aarch64
            upload_phar: false
          - runner: macos-latest
            spc-binary: spc-macos-aarch64
            output: clonio-macos-aarch64
            upload_phar: false

    env:
      PHP_VERSION: '8.5'
      # mbregex is a separate SPC extension (not part of mbstring) that provides mb_ereg*
      # and mb_regex_encoding. mPDF checks for it at runtime and fails without it.
      # Adding it here makes SPC auto-pull the onig library via its lib-depends.
      EXTENSIONS: ctype,curl,fileinfo,filter,gd,iconv,mbstring,mbregex,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,phar,readline,session,sqlite3,tokenizer,zlib
      # Optional gd image libs. libpng + zlib are hard-deps and always built;
      # these add JPEG, WebP, and TrueType font support for mpdf-generated PDFs.
      # libavif intentionally omitted (heavy aom/dav1d toolchain, rarely used in PDFs).
      # Keep GD_LIBS_SLUG in sync — cache keys cannot contain commas.
      GD_LIBS: 'libjpeg,libwebp,freetype'
      GD_LIBS_SLUG: 'libjpeg-libwebp-freetype'
      # Pin OpenSSL to 3.x. OpenSSL 4.0.0 removed ERR_NUM_ERRORS, which PHP 8.5's
      # openssl extension still references — fresh downloads otherwise grab 4.x and fail to compile.
      OPENSSL_VERSION: '3.6.2'
      # Pin libcares to a known-good tag. SPC 2.8.4 release-metadata lookup has been
      # flaky for c-ares/c-ares; pinning + direct URL bypasses the GH releases API path.
      LIBCARES_VERSION: '1.34.6'
      # GitHub-hosted macOS runners currently include untrusted third-party
      # Homebrew taps unrelated to this build. Keep the transition behavior
      # explicit until Homebrew trust checks become the default.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download SPC binary
        run: |
          curl -fsSL "https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.4/${{ matrix.spc-binary }}.tar.gz" \
            -o spc.tar.gz
          tar -xzf spc.tar.gz
          chmod +x ./spc
          rm spc.tar.gz

      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo ./spc doctor --auto-fix
            sudo chown -R "$(id -u):$(id -g)" .
          else
            brew install pkg-config || true
            ./spc doctor --auto-fix
          fi

      - name: Cache SPC downloaded sources
        id: spc-downloads-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ./downloads
          # Key by matrix.output so Linux x86_64 and Linux aarch64 don't share a cache.
          # Previously used runner.os only, which collided across the two Linux arches.
          key: spc-downloads-${{ matrix.output }}-php${{ env.PHP_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-gd${{ env.GD_LIBS_SLUG }}-mbregex-cares${{ env.LIBCARES_VERSION }}

      - name: Download PHP sources & extensions
        if: steps.spc-downloads-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc download \
            --with-php=${{ env.PHP_VERSION }} \
            --for-extensions="${{ env.EXTENSIONS }}" \
            --for-libs="${{ env.GD_LIBS }}" \
            --custom-url="openssl:https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz" \
            --custom-url="libcares:https://github.com/c-ares/c-ares/releases/download/v${{ env.LIBCARES_VERSION }}/c-ares-${{ env.LIBCARES_VERSION }}.tar.gz"

      - name: Cache SPC build output
        id: spc-build-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ./buildroot
          key: spc-build-${{ matrix.output }}-php${{ env.PHP_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-gd${{ env.GD_LIBS_SLUG }}-mbregex-cares${{ env.LIBCARES_VERSION }}

      - name: Compile PHP micro SAPI
        if: steps.spc-build-cache.outputs.cache-hit != 'true'
        run: ./spc build --build-micro --with-libs="${{ env.GD_LIBS }}" ${{ runner.debug == '1' && '--debug' || '' }} "${{ env.EXTENSIONS }}"

      - name: Upload SPC logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spc-logs-${{ matrix.output }}
          path: log/
          if-no-files-found: ignore

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Strip unused vendor assets
        # mpdf bundles ~87MB of TTF/OTF font families. AuditLogRenderer only uses
        # the DejaVu family (default_font => DejaVuSans). Dropping the rest shaves
        # ~38MB off the resulting PHAR / static binary with no runtime impact.
        # Keep DejaVu* fonts plus DejaVuinfo.txt (licence/info read at runtime).
        run: |
          find vendor/mpdf/mpdf/ttfonts -mindepth 1 \
              ! -name 'DejaVu*' \
              ! -name 'DejaVuinfo.txt' \
              -delete

      - name: Stamp version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dev-${GITHUB_SHA::7}" > VERSION
          else
            echo "${{ github.ref_name }}" > VERSION
          fi

      - name: Build PHAR
        run: php clonio app:build clonio --no-interaction

      - name: Combine PHAR + micro into standalone binary
        run: |
          ./spc micro:combine builds/clonio --output ${{ matrix.output }}
          chmod +x ./${{ matrix.output }}

      # Code signing and notarization — disabled until Apple Developer account is configured.
      # See docs/code-signing.md for setup instructions.
      #
      # - name: Import code signing certificate (macOS)
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
      #   env:
      #     APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import certificate.p12 -k build.keychain \
      #       -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     rm certificate.p12
      #
      # - name: Sign binary (macOS)
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
      #   env:
      #     APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   run: |
      #     codesign --deep --force --verify --verbose \
      #       --sign "$APPLE_SIGNING_IDENTITY" \
      #       --options runtime \
      #       ./${{ matrix.output }}
      #
      # - name: Notarize binary (macOS)
      #   if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
      #   env:
      #     APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     zip ${{ matrix.output }}.zip ${{ matrix.output }}
      #     xcrun notarytool submit ${{ matrix.output }}.zip \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_ID_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --wait
      #     rm ${{ matrix.output }}.zip

      - name: Smoke test — version
        run: ./${{ matrix.output }} --version

      - name: Smoke test — functional (binary)
        run: ./tests/smoke/run-smoke.sh bin "$PWD/${{ matrix.output }}"

      - name: Smoke test — functional (PHAR)
        if: matrix.upload_phar
        run: ./tests/smoke/run-smoke.sh phar "$PWD/builds/clonio"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

      - name: Upload PHAR as artifact
        if: matrix.upload_phar
        run: cp builds/clonio builds/clonio.phar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.upload_phar
        with:
          name: clonio.phar
          path: builds/clonio.phar

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build amd64 image into local daemon (for smoke)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clonio:smoke-test
          cache-from: type=gha

      - name: Smoke test — PHP database extensions (Docker)
        run: |
          docker run --rm --entrypoint php clonio:smoke-test -r '
          $required = ["pdo_sqlite", "sqlite3", "sqlsrv", "pdo_sqlsrv"];
          $missing = array_values(array_filter($required, static fn ($extension) => ! extension_loaded($extension)));
          if ($missing !== []) {
              fwrite(STDERR, "Missing PHP extensions: ".implode(", ", $missing).PHP_EOL);
              exit(1);
          }
          echo "Required PHP database extensions are loaded.".PHP_EOL;
          '

      - name: Smoke test — functional (Docker)
        run: ./tests/smoke/run-smoke.sh docker clonio:smoke-test

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/clonio-dev/clonio
          # We control :latest explicitly — default flavor would tag every push :latest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            # Dry-run dispatches aren't tag pushes, so the semver patterns above produce nothing —
            # this gives the build a deterministic dev tag and silences metadata-action warnings.
            type=sha,prefix=dev-,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/clonio-dev/clonio-cli
            org.opencontainers.image.description=Clonio CLI — safe production-to-dev database transfers
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push on tag; on workflow_dispatch we only build (validates the Dockerfile).
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish Release
    needs: [test, build, docker]
    runs-on: ubuntu-latest
    # Skip on workflow_dispatch — manual runs are dry-runs (artifacts only, no release).
    if: always() && needs.test.result == 'success' && needs.build.result == 'success' && needs.docker.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts
          # Explicit allowlist — excludes Docker Buildx summary artifacts and spc-logs-* from failed attempts.
          pattern: '{clonio-linux-*,clonio-macos-*,clonio.phar}'
          merge-multiple: true

      # Immutable releases become locked only after publishing. Create the
      # draft after all verification/build jobs pass, then upload assets and
      # publish as the final step.
      - name: Create draft GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-alpha* || "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-rc* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG_NAME" \
            --draft \
            --generate-notes \
            --verify-tag \
            --title "Release $TAG_NAME" \
            $PRERELEASE_FLAG

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ./artifacts/* --clobber

      - name: Append installation notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json body --jq .body > release-notes.md

          cat >> release-notes.md <<'EOF'

          See the full [CHANGELOG.md](https://github.com/clonio-dev/clonio-cli/blob/main/CHANGELOG.md).

          ---

          ## Installation

          | File | Platform | Requires |
          |------|----------|----------|
          | `clonio-linux-x86_64` | Linux — x86_64 (Intel/AMD) | nothing |
          | `clonio-linux-aarch64` | Linux — aarch64 (ARM64) | nothing |
          | `clonio-macos-aarch64` | macOS — Apple Silicon (M1/M2/M3/M4) | nothing |
          | `clonio.phar` | Any platform | PHP 8.5 |
          | `ghcr.io/clonio-dev/clonio:${{ github.ref_name }}` | linux/amd64 + linux/arm64 | Docker |

          ### Linux

          ```bash
          mv clonio-linux-x86_64 clonio   # or clonio-linux-aarch64 for ARM
          chmod +x clonio
          sudo mv clonio /usr/local/bin/clonio
          clonio --version
          ```

          ### macOS

          > ⚠️ The binary is currently unsigned. macOS Gatekeeper will block it on first run.

          ```bash
          mv clonio-macos-aarch64 clonio
          chmod +x clonio
          xattr -d com.apple.quarantine clonio
          sudo mv clonio /usr/local/bin/clonio
          clonio --version
          ```

          ### PHAR (any platform with PHP 8.5)

          ```bash
          php clonio.phar --version
          ```

          ### Docker

          ```bash
          docker pull ghcr.io/clonio-dev/clonio:${{ github.ref_name }}
          docker run --rm -v "$(pwd)":/workspace \
            ghcr.io/clonio-dev/clonio:${{ github.ref_name }} --version
          ```

          See [docs/docker-distribution.md](https://github.com/clonio-dev/clonio-cli/blob/main/docs/docker-distribution.md) for pinning, tag scheme, and common recipes.

          ### Composer (dev dependency)

          ```bash
          composer require --dev clonio-dev/clonio-cli
          vendor/bin/clonio --version
          ```
          EOF

          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

  notify-packagist:
    name: Notify Packagist
    needs: release
    runs-on: ubuntu-latest
    # Skip for pre-release tags (alpha/beta/rc) — keeps Packagist listing focused on stable releases.
    if: always() && needs.release.result == 'success' && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc')
    steps:
      - name: Ping Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://packagist.org/packages/clonio-dev/clonio-cli"}}'
