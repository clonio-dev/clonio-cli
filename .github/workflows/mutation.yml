name: mutation

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  mutation:
    permissions:
      contents: read
      issues: write
    # macOS runner: pest-plugin-mutate passes every covering test in one
    # --filter argument, which exceeds Linux's 128 KiB per-argument limit
    # (E2BIG -> ProcessStartFailedException) for widely covered lines.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pull requests mutate only the app files they change; the weekly and
      # manual runs mutate the whole app.
      - name: Select files
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=AMR "origin/${{ github.base_ref }}...HEAD" -- 'app/*.php' | paste -sd, -)
            echo "paths=$FILES" >> "$GITHUB_OUTPUT"
            [ -n "$FILES" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.scope.outputs.run == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Install Dependencies
        if: steps.scope.outputs.run == 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Mutation tests (changed files)
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        run: vendor/bin/pest --mutate --covered-only --parallel --no-cache --min=100 --path="${{ steps.scope.outputs.paths }}"

      - name: Mutation tests (whole app)
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          composer test:mutate:all 2>&1 | tee mutation.log

      # Weekly/manual run failed: open an issue, or comment on the open one.
      - name: Report surviving mutants
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LOG=$(sed -E 's/\x1b\[[0-9;]*m//g' mutation.log 2>/dev/null || true)
          SURVIVORS=$(grep -E '^\s*UNTESTED ' <<<"$LOG" | sed -E 's/^\s*UNTESTED /- /' || true)
          SUMMARY=$(grep -E 'Mutations:|Score:' <<<"$LOG" || true)
          [ -n "$SURVIVORS" ] || SURVIVORS=$(printf '```\n%s\n```' "$(tail -n 40 <<<"$LOG")")
          BODY=$(printf 'The full mutation run (${{ github.event_name }}) failed: %s\n\n%s\n\n%s\n\nReproduce with `composer test:mutate:all` or `composer test:mutate -- --path=<file>`.\n' "$RUN_URL" "$SUMMARY" "$SURVIVORS")

          gh label create mutation --color D93F0B --description "Mutation testing" --force
          ISSUE=$(gh issue list --label mutation --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "Mutation testing: surviving mutants" --label mutation --body "$BODY"
          fi
